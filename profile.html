<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="profile">
        <div id="header" class="welcome"></div>
        <div id="projects"></div>
        <div id="template" class="fade">
            <div class="template">
                <div id="fields">
                    <input autocomplete="false" placeholder="Title" type="text" id="templateName" name="templateName">
                    <textarea placeholder="Description..." id="templateDescription" name="templateDescription"></textarea>
                </div>
                <div id="templateButton">+</div>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        let template; let templateName; let templateDescription; let templateTemplate;
        function init() {
            LoadProjects();

            template = document.getElementById("template");
            templateName = document.getElementById("templateName");
            templateDescription = document.getElementById("templateDescription");
            //templateTemplate = document.getElementById("templateTemplate");

            template.onclick = (event) => {
                if (event.target == template) {
                    template.classList.toggle("fadeOut");
                }
            }
            document.getElementById("templateButton").addEventListener("click", () => {
                CreateProject();
                template.classList.toggle("fadeOut");
            });
        }

        async function LoadProjects() {
            let response;
            await fetch("/profile/info", {
                method: "GET", headers: { "Content-type": "application/json" }
            }).then((res) => res.json()).then((res) => response = res);

            DisplayProjects(response);
        }

        async function CreateProject() {
            let response;
            await fetch("/new", {
                method: "POST", headers: { "Content-type": "application/json" },
                body: JSON.stringify({
                    name: document.getElementById("templateName").value,
                    description: document.getElementById("templateDescription").value
                })
            }).then((res) => res.json()).then((res) => response = res);

            DisplayProjects(response);
        }

        function DisplayProjects(data) {
            // Personal data
            document.getElementById("header").textContent = "Welcome, " + data.name;

            // Clear out current projects
            const projects = document.getElementById("projects");
            while (projects.firstChild) {
                projects.removeChild(projects.lastChild);
            }

            // Append the create button
            const projectButton = document.createElement("a");
            projectButton.id = "projectButton";
            projectButton.classList.add("project");
            const projectImage = document.createElement("img");
            projectImage.src = "Resources/PlusIcon.png";
            projectButton.appendChild(projectImage);
            projects.appendChild(projectButton);
            projectButton.onclick = () => {
                template.classList.toggle("fadeOut");
            }

            // Append the user's created projects
            for (let projectID in data.projects) {
                const project = data.projects[projectID];

                const element = document.createElement("a");
                element.classList.add("project");

                const name = document.createElement("p");
                name.textContent = project.name;
                name.style.fontSize = "200%";
                element.appendChild(name);

                const description = document.createElement("p");
                description.textContent = project.description;
                element.appendChild(description);

                const cover = document.createElement("img");
                cover.src = project.cover;
                element.appendChild(cover);

                element.href = "/project/" + projectID;
                projects.appendChild(element);
            }
        }

        window.onload = init;
    </script>
</body>
</html>
